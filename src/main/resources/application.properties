# H2 Database Configuration
spring.datasource.url=jdbc:h2:mem:testdb              # In-memory database
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.sql.init.mode=always

# Database Initialization
spring.sql.init.schema-locations=classpath:schema.sql  # Auto-initialize tables
spring.sql.init.data-locations=classpath:data.sql      # Auto-initialize data

# H2 Console (For Manual Debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console